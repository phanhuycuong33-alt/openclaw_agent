# OpenClaw Local Mode - CLI Only (No Web Gateway)
# Usage: docker compose -f docker-compose-local.yml up -d
# Or default: docker compose up -d (if this is docker-compose.yml)

services:
  openclaw-cli:
    build:
      context: .
      dockerfile: docker/Dockerfile.openclaw-ssh
    image: openclaw-ssh:latest
    env_file:
      - path: docker/.env
        required: false
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      BROWSER: echo
      TZ: ${OPENCLAW_TZ:-UTC}
      # AI Provider Configuration
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-}
    volumes:
      - "${HOME}/.openclaw:/home/node/.openclaw"
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    restart: "no"
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('ok')"]
      interval: 2s
      timeout: 1s
      retries: 3
      start_period: 5s

  openclaw-ssh:
    build:
      context: .
      dockerfile: docker/Dockerfile.openclaw-ssh
    image: openclaw-ssh:latest
    env_file:
      - path: docker/.env
        required: false
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TZ: ${OPENCLAW_TZ:-UTC}
    volumes:
      - "${HOME}/.openclaw:/home/node/.openclaw"
    ports:
      - "2222:22"
    init: true
    restart: "no"
    user: root
    command: ["/usr/sbin/sshd", "-D"]
    healthcheck:
      test: ["CMD", "sh", "-c", "ps aux | grep '[s]shd' || exit 1"]
      interval: 2s
      timeout: 1s
      retries: 3
      start_period: 5s
